# Every push or merged PR on main is built, then deployed to the VPS.
# The server side is /usr/local/bin/humatindo-deploy (the CI SSH key can run nothing else).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 72.61.208.119
  DEPLOY_USER: dev
  SITE_URL: https://humatindo.whisttle.net

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship source and rebuild container
        run: |
          git archive --format=tar HEAD | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Check the live site
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null "$SITE_URL"; then
              echo "Live: $SITE_URL (${GITHUB_SHA::7})"
              exit 0
            fi
            sleep 5
          done
          echo "Site did not return 200 after deploy" >&2
          exit 1
